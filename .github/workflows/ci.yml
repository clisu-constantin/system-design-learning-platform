name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Pure logic only (progress rules), on Node's own runner - no test dependency.
      - name: Test
        run: npm test

      # check:visuals + check:content + typecheck + vite build + bundle budget
      - name: Build
        run: npm run build

      # Production dependencies only: dev-server advisories do not ship to users.
      # High and critical fail the run; moderate ones are reported in the log.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

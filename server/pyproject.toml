[project]
name = "sdi-server"
version = "0.1.0"
description = "Account backend of System Design Interactive: checks Firebase ID tokens and saves progress."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

# An application, not a library: uv installs the dependencies only, and `app` is
# imported from the working directory (uvicorn and pytest both run from server/).
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Starlette now points its TestClient at httpx2; httpx still works and is what the app itself uses.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT"]
# assert is how pytest checks things.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
